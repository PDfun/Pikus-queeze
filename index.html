<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikus Squeeze</title>
<meta name="description" content="Link shortener.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg:#040509;
    --surface: rgba(255,255,255,0.035);
    --surface-2: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.18);
    --text:#EDEEF5;
    --muted:#8890A6;
    --violet:#8B5CF6;
    --cyan:#00E5FF;
    --magenta:#FF3EC9;
    --grad: linear-gradient(135deg, #8B5CF6 0%, #00E5FF 60%, #FF3EC9 100%);
    --success:#3FE0A8;
    --success-dim: rgba(63,224,168,0.10);
    --danger:#FF4D6D;
    --danger-dim: rgba(255,77,109,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:56px 20px;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient glow field */
  body::before, body::after{
    content:'';
    position:fixed;
    width:560px;height:560px;
    border-radius:50%;
    filter:blur(120px);
    z-index:0;
    pointer-events:none;
    opacity:0.3;
  }
  body::before{ top:-180px; left:-160px; background:var(--violet); animation:drift1 16s ease-in-out infinite; }
  body::after{ bottom:-200px; right:-160px; background:var(--cyan); animation:drift2 18s ease-in-out infinite; }
  @keyframes drift1{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(60px,40px) scale(1.15); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-50px,-30px) scale(1.1); }
  }

  .grid-overlay{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse 800px 500px at 50% 0%, black, transparent 70%);
  }

  .scanline{
    position:fixed;left:0;right:0;height:140px;z-index:0;pointer-events:none;
    background:linear-gradient(180deg, transparent, rgba(0,229,255,0.05), transparent);
    animation:sweep 7s linear infinite;
  }
  @keyframes sweep{
    0%{ top:-140px; }
    100%{ top:100vh; }
  }

  .wrap{max-width:560px;margin:0 auto;position:relative;z-index:1;}

  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;}
  .brand .left{display:flex;align-items:center;gap:11px;}
  .brand .mark{
    width:32px;height:32px;border-radius:9px;
    background:var(--grad);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#05060A;font-size:15px;flex-shrink:0;
    box-shadow:0 0 22px rgba(124,108,240,0.45);
    animation:pulseGlow 3s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 22px rgba(124,108,240,0.45); }
    50%{ box-shadow:0 0 32px rgba(63,224,208,0.55); }
  }
  .brand .name{
    font-family:'Orbitron',sans-serif;
    font-weight:800;font-size:15px;letter-spacing:0.04em;text-transform:uppercase;
    background:var(--grad);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 10px rgba(139,92,246,0.35));
  }
  .brand .dot{
    width:6px;height:6px;border-radius:50%;background:var(--success);
    box-shadow:0 0 8px var(--success);
    margin-left:2px;
    animation:blink 2.4s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .gear{
    border:1px solid var(--border);background:var(--surface);color:var(--muted);
    width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(12px);
    transition:all .15s ease;
  }
  .gear:hover{background:var(--surface-2);border-color:var(--border-strong);color:var(--text);}

  .panel{
    border:1px solid var(--border);border-radius:14px;background:var(--surface);
    backdrop-filter:blur(20px);
    padding:18px;margin-bottom:22px;display:none;
  }
  .panel.open{display:block;}
  .panel label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:7px;}
  .panel input{
    width:100%;background:rgba(0,0,0,0.25);border:1px solid var(--border-strong);border-radius:9px;
    color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:10px 12px;outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .panel input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,108,240,0.18);}
  .panel .save{
    margin-top:13px;border:none;background:var(--grad);color:#05060A;font-weight:700;font-size:13px;
    padding:9px 18px;border-radius:9px;cursor:pointer;
  }
  .panel .save:hover{filter:brightness(1.08);}
  .panel .saved-msg{font-size:12px;color:var(--success);margin-left:10px;display:none;}
  .panel .hint{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.55;}
  .panel .hint code{color:var(--cyan);font-family:'JetBrains Mono',monospace;}

  .card-frame{position:relative;padding:10px;}
  .corner{
    position:absolute;width:16px;height:16px;
    border:2px solid var(--cyan);
    opacity:0.7;
    filter:drop-shadow(0 0 4px var(--cyan));
  }
  .corner.tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:4px 0 0 0;}
  .corner.tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 4px 0 0;}
  .corner.bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 4px;}
  .corner.br{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 4px 0;}

  .card{
    position:relative;
    border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:8px;
    display:flex;gap:8px;
    backdrop-filter:blur(20px);
    transition:box-shadow .2s ease;
  }
  .card::before{
    content:'';
    position:absolute;inset:-1px;
    border-radius:17px;
    padding:1px;
    background:conic-gradient(from var(--angle,0deg), var(--violet), var(--cyan), var(--violet));
    opacity:0.55;
    transition:opacity .25s ease;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    animation:rotateBorder 6s linear infinite;
  }
  @property --angle{
    syntax:'<angle>';
    initial-value:0deg;
    inherits:false;
  }
  @keyframes rotateBorder{ to{ --angle:360deg; } }
  .card:focus-within::before{opacity:1;}
  .card:focus-within{box-shadow:0 0 34px rgba(124,108,240,0.22);}
  .card input{
    flex:1;background:transparent;border:none;outline:none;color:var(--text);
    font-size:14.5px;padding:13px 14px;min-width:0;
  }
  .card input::placeholder{color:var(--muted);}
  .card button{
    border:none;background:var(--grad);background-size:180% 180%;color:#05060A;font-weight:700;font-size:14px;
    padding:0 24px;border-radius:11px;cursor:pointer;white-space:nowrap;
    transition:filter .15s ease, transform .1s ease, background-position .4s ease, box-shadow .2s ease;
  }
  .card button:hover{filter:brightness(1.1);background-position:100% 0;box-shadow:0 0 24px rgba(124,108,240,0.4);}
  .card button:active{transform:scale(0.97);}
  .card button:disabled{opacity:0.5;cursor:default;filter:none;box-shadow:none;}

  .status{min-height:18px;font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:10px;color:var(--muted);padding-left:2px;}
  .status.err{color:var(--danger);}
  .status.ok{color:var(--success);}

  .result{
    position:relative;
    margin-top:16px;border:1px solid rgba(63,224,168,0.35);background:var(--success-dim);border-radius:14px;
    padding:15px 17px 15px 21px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    backdrop-filter:blur(20px);
    animation:rise .3s cubic-bezier(.2,.8,.2,1);
    overflow:hidden;
  }
  .result::before{
    content:'';
    position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--success);
    box-shadow:0 0 12px var(--success);
  }
  @keyframes rise{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  .result a{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14.5px;color:var(--success);
    text-decoration:none;word-break:break-all;
  }
  .result a:hover{text-decoration:underline;}
  .copy-btn{
    border:1px solid var(--border-strong);background:rgba(255,255,255,0.04);color:var(--text);font-size:13px;
    font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;flex-shrink:0;
  }
  .copy-btn:hover{background:rgba(255,255,255,0.08);}

  .section-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:600;color:var(--cyan);text-transform:uppercase;letter-spacing:0.12em;
    margin:40px 0 14px;display:flex;align-items:center;gap:8px;
    text-shadow:0 0 8px rgba(0,229,255,0.4);
  }
  .section-label::before{
    content:'';
    width:12px;height:1px;
    background:var(--grad);
    box-shadow:0 0 6px var(--cyan);
  }

  .empty{color:var(--muted);font-size:13.5px;padding:26px 0;text-align:center;border:1px dashed var(--border-strong);border-radius:14px;}
  .row{
    display:flex;align-items:center;gap:12px;padding:13px 10px;border-bottom:1px solid var(--border);
    border-radius:10px;
    transition:background .15s ease, transform .15s ease;
  }
  .row:hover{background:rgba(255,255,255,0.03);transform:translateX(2px);}
  .row:last-child{border-bottom:none;}
  .row .main{min-width:0;flex:1;}
  .row .short{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:600;color:var(--cyan);text-decoration:none;display:block;}
  .row .long{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .row .actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--muted);width:29px;height:29px;
    border-radius:8px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .icon-btn:hover{background:var(--surface-2);border-color:var(--border-strong);color:var(--text);}
  .icon-btn.danger:hover{background:var(--danger-dim);border-color:var(--danger);color:var(--danger);}
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="scanline"></div>
<div class="wrap">
  <div class="brand">
    <div class="left"><div class="mark">P</div><div class="name">Pikus Squeeze</div><div class="dot" title="Online"></div></div>
    <button class="gear" id="gearBtn" title="Settings">⚙</button>
  </div>

  <div class="panel" id="panel">
    <label>Passphrase</label>
    <input id="secretInput" type="password" autocomplete="off" />
    <button class="save" id="saveSettings">Save</button>
    <span class="saved-msg" id="savedMsg">Saved</span>
  </div>

  <div class="card-frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <form class="card" id="form">
      <input type="url" id="longUrl" placeholder="Paste a long URL" required autocomplete="off" />
      <button type="submit" id="submitBtn">Shorten</button>
    </form>
  </div>
  <div class="status" id="status"></div>

  <div id="resultBox"></div>

  <div class="section-label">History</div>
  <div id="history"></div>
</div>

<script>
const SECRET_KEY = 'pikus_secret';
const HIST_KEY = 'pikus_squeeze_links';

const $ = (id) => document.getElementById(id);
const gearBtn = $('gearBtn'), panel = $('panel');
const secretInput = $('secretInput'), saveSettings = $('saveSettings'), savedMsg = $('savedMsg');
const form = $('form'), input = $('longUrl'), statusEl = $('status'), submitBtn = $('submitBtn');
const resultBox = $('resultBox'), historyEl = $('history');

let secret = localStorage.getItem(SECRET_KEY) || '';
secretInput.value = secret;
if(!secret) panel.classList.add('open');

gearBtn.addEventListener('click', () => panel.classList.toggle('open'));
saveSettings.addEventListener('click', () => {
  secret = secretInput.value.trim();
  localStorage.setItem(SECRET_KEY, secret);
  savedMsg.style.display = 'inline';
  setTimeout(()=> savedMsg.style.display = 'none', 2000);
});

let links = [];
function loadHistory(){
  try{ links = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }catch(e){ links = []; }
  renderHistory();
}
function saveHistory(){ localStorage.setItem(HIST_KEY, JSON.stringify(links)); }

function renderHistory(){
  if(!links.length){
    historyEl.innerHTML = '<div class="empty">No links yet</div>';
    return;
  }
  historyEl.innerHTML = links.map((l, i) => `
    <div class="row">
      <div class="main">
        <a class="short" href="${l.short}" target="_blank" rel="noopener">${l.short.replace(/^https?:\/\//,'')}</a>
        <div class="long">${l.long}</div>
      </div>
      <div class="actions">
        <button class="icon-btn" title="Copy" onclick="copyLink('${l.short}', this)">⧉</button>
        <button class="icon-btn danger" title="Remove" onclick="removeLink(${links.length - 1 - i})">✕</button>
      </div>
    </div>
  `).join('');
}

window.copyLink = function(url, btn){
  navigator.clipboard.writeText(url).then(()=>{
    const old = btn.textContent;
    btn.textContent = '✓';
    setTimeout(()=>btn.textContent = old, 1000);
  });
}
window.removeLink = function(idx){
  links.splice(idx,1);
  saveHistory();
  renderHistory();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const longUrl = input.value.trim();
  if(!longUrl) return;

  submitBtn.disabled = true;
  submitBtn.textContent = '···';
  statusEl.textContent = '';
  statusEl.className = 'status';
  resultBox.innerHTML = '';

  try{
    const res = await fetch('/.netlify/functions/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-shorten-secret': secret },
      body: JSON.stringify({ url: longUrl })
    });

    let json;
    try{
      json = await res.json();
    }catch(e){
      throw new Error(`Unexpected response (status ${res.status}).`);
    }
    if(!res.ok) throw new Error(json.error || `Request failed (status ${res.status})`);

    links.unshift({ long: longUrl, short: json.shortUrl, date: new Date().toISOString() });
    saveHistory();
    renderHistory();

    resultBox.innerHTML = `
      <div class="result">
        <a href="${json.shortUrl}" target="_blank" rel="noopener">${json.shortUrl}</a>
        <button class="copy-btn" onclick="copyLink('${json.shortUrl}', this)">Copy</button>
      </div>
    `;
    input.value = '';
  }catch(err){
    statusEl.textContent = err.message || 'Something went wrong.';
    statusEl.className = 'status err';
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Shorten';
  }
});

loadHistory();
</script>
</body>
</html>
